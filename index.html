<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OPEN - A Door to the World</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="open.css">
</head>
<body>

    <!-- Preloader -->
    <div id="preloader">
        <div class="door-loader"></div>
        <div class="loader-text">OPEN</div>
    </div>

    <!-- Contenedor Espacial Minimalista -->
    <div class="space-container">
        <!-- Fondo de estrellas estáticas -->
        <div class="stars"></div>

        <!-- Menú superior sin Exámenes -->
        <nav class="minimal-nav">
            <a onclick="openModal('mirta')">Directora</a>
            <a onclick="openModal('sofia')">Profesores</a>
            <a onclick="openModal('cursos')">Cursos</a>
            <a onclick="openModal('rotary')">Rotary</a>
        </nav>

        <!-- Contenido Central -->
        <main class="hero-content">
            <span class="eyebrow">A DOOR TO THE WORLD</span>
            
            <!-- Marca con Esfera a la par de OPEN -->
            <div class="brand-header">
                <div class="logo-container" onclick="openModal('core')" title="Ver información de la institución">
                    <svg class="sphere-svg" viewBox="0 0 200 200">
                        <defs>
                            <clipPath id="circleClip"><circle cx="100" cy="100" r="95" /></clipPath>
                        </defs>
                        <circle cx="100" cy="100" r="95" fill="#1D4ED8" />
                        <g clip-path="url(#circleClip)" stroke="#FFFFFF" stroke-width="12" fill="none">
                            <path d="M -20,60 Q 60,100 120,20" />
                            <path d="M -20,100 Q 80,140 160,40" />
                            <path d="M -20,140 Q 100,180 200,60" />
                            <path d="M 0,180 Q 120,220 220,100" />
                            <path d="M 40,220 Q 140,250 240,140" />
                        </g>
                    </svg>

                    <div class="door-3d-wrapper">
                        <div class="door-frame"></div>
                        <div class="door-panel">
                            <div class="keyhole-handle"></div>
                        </div>
                    </div>
                </div>

                <h1 class="main-title">OPEN</h1>
            </div>

            <p class="hero-desc">Bienvenido a nuestra institución. Nuestra misión es abrir puertas a nuevas oportunidades globales a través de la enseñanza de excelencia del idioma inglés.</p>
            
            <div class="action-buttons">
                <button class="btn-primary" onclick="openModal('contacto')">LET'S START.</button>
                <button class="btn-icon" onclick="openGallery('videos')" title="Ver Videos">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                </button>
                <button class="btn-icon" onclick="openGallery('images')" title="Ver Fotos">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
                </button>
            </div>
        </main>
    </div>

    <!-- Modal Interactivo -->
    <div id="infoModal" class="modal">
        <div class="modal-card">
            <span class="modal-close" onclick="closeModal()">&times;</span>
            <div id="modalBody"></div>
        </div>
    </div>

    <script src="opennn.js"></script>
</body>
</html>
